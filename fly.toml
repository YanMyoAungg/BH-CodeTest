app = "bh-codetest"

[build]
  dockerfile = "Dockerfile"
  dockerfile-target = "fly"

[[vm]]
  memory = "512mb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true

[mounts]
  source = "sqlite_data"
  destination = "/app/server/data"
  initial_size = "1gb"
